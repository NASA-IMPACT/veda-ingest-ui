version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
        - "*"
      npm-security:
        applies-to: security-updates
        patterns:
        - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
        - "*"
    commit-message:
      prefix: "ci(deps):"
