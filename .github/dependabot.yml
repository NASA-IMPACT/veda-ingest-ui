version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    open-pull-requests-limit: 10 # upped from default since prod majors would be their own 
    groups:
      production-dependencies: # group minor and patch updates and have major updates come through alone
        dependency-type: "production"
        update-types:
        - "minor"
        - "patch"
        patterns:
        - "*"
      development-dependencies:
        dependency-type: "development"
        patterns:
        - "*"
      npm-security:
        applies-to: security-updates
        patterns:
        - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
        - "*"
    commit-message:
      prefix: "ci(deps):"
