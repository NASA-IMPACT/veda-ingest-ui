name: CI

on:
  push:
    branches: [main]

jobs:
  Playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack (Yarn from packageManager)
        run: corepack enable
      - run: yarn install --immutable

      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: yarn test:e2e
        env:
          NEXT_PUBLIC_DISABLE_AUTH: 'true'
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_MOCK_SCOPES: dataset:update stac:collection:update dataset:create
          NEXT_PUBLIC_KEYCLOAK_ISSUER: https://example.test/realms/veda
          KEYCLOAK_CLIENT_ID: ingest-ui
          APP_ID: '1'
          INSTALLATION_ID: '1'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Publish HTML report to GH Page
        if: always()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report/
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
