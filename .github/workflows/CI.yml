name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn from packageManager)
        run: corepack enable

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type checking
        run: yarn type-check

      - name: Run unit tests
        run: yarn test

      - name: Install Playwright Browsers
        run: yarn playwright install chromium

      - name: Run Playwright E2E Tests
        run: yarn test:e2e
        env:
          NEXT_PUBLIC_DISABLE_AUTH: 'true'
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_MOCK_SCOPES: dataset:update stac:collection:update dataset:create
          NEXT_PUBLIC_KEYCLOAK_ISSUER: https://example.test/realms/veda
          KEYCLOAK_CLIENT_ID: ingest-ui
          APP_ID: '1'
          INSTALLATION_ID: '1'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
